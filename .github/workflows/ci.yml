name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Lint
        run: |
          script=$(node -e "const s=require('./package.json').scripts||{}; process.stdout.write(s.lint||'')")
          if [ -n "$script" ]; then
            npm run lint
          else
            echo "No lint script configured; skipping."
          fi
      - run: npm test
